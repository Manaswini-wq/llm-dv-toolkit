[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "llm-dv-toolkit"
version = "1.0.0"
description = "AI-Powered Design Verification: MCP Server, Test Generation, Debug Assistant"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "DV Engineering"}]
dependencies = [
    "openai>=1.3",
    "anthropic>=0.18",
    "pyyaml>=6.0",
    "rich>=13.0",
    "numpy>=1.24",
    "aiosqlite>=0.19",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.1.0", "mypy>=1.0"]

[project.scripts]
llm-dv = "llm_dv_toolkit.__main__:main"
llm-dv-mcp = "llm_dv_toolkit.mcp_server.server:main"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
